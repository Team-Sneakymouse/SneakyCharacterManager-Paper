name: Publish Maven API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        run: ./gradlew build --no-daemon --console=plain

      - name: Fetch Maven credentials from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Maven

      - name: Publish artifacts
        run: |
          : "${MAVEN_USERNAME:?Infisical must provide MAVEN_USERNAME}"
          : "${MAVEN_PASSWORD:?Infisical must provide MAVEN_PASSWORD}"
          export ORG_GRADLE_PROJECT_sneakyrpUsername="$MAVEN_USERNAME"
          export ORG_GRADLE_PROJECT_sneakyrpPassword="$MAVEN_PASSWORD"
          ./gradlew publishAllPublicationsToSneakyrpRepository --no-daemon --console=plain
