# Identity storage is selected ONCE at enable. Changing this requires a full restart.
# Missing key and legacy preserve the current Bungee/Velocity messaging setup and keys.ser.
# sneakydb is opt-in: requires SneakyDB and operator-applied db/001_scm.sql + manual import.
# No importer, schema creation, SQL access or SneakyDB runtime is used in legacy mode.
# Locations/inventories/attributes/other gameplay state remain Paper file-backed in both modes.
storage:
  backend: legacy
  # Bounds readiness and each request. 1..60; restart required to change.
  # An uncertain database operation fences its owner until restart, never blindly retries.
  requestTimeoutSeconds: 15

deleteCharacterDataOnServerStart: false
manageLocations: true
manageInventories: true
manageAttributes: false
respawnNameTags: false
respawnTimerSeconds: 600
see-own-nameplate: false
# MiniMessage styling applied before title display text on the nameplate second line
titlePrefix: '<gray>'
mineskinQueueUrl: 'https://api.mineskin.org/v2/queue'
mineskinSkinsUrl: 'https://api.mineskin.org/v2/skins'
mineskinAuth: ''
mineskinUserAgent: 'SneakyCharacterManager/1.0'
skin:
  resolveTimeoutSeconds: 5
mineskin:
  logging:
    enabled: true
  debug: false
  rate_limit_base: 20
  min_capacity_reservation: 5
  preload_active_days: 8
imgurApiUrl: 'https://api.imgur.com/3/image'
imgurClientId: ''
webServerFolderPath: ''
webServerURLPrefix: ''
gender-suffixes:
  masculine: ' &9♂'
  feminine: ' &d♀'
  nonbinary: ' &a⚥'
bannedWords:
  - badword