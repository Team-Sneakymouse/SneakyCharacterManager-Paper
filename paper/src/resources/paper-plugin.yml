name: SneakyCharacterManager
version: ${version}
main: net.sneakycharactermanager.paper.SneakyCharacterManager
description: Paper/Bungee/Velocity plugin for switching characters in DvZ and LoM
author: Team Sneakymouse
website: https://rawb.tv
api-version: '26.2'

dependencies:
  server:
    SneakyDB:
      load: BEFORE
      required: false
      join-classpath: true
    SneakyUtils:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
    LuckPerms:
      load: BEFORE
      required: false
    voicechat:
      load: BEFORE
      required: false
